<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>桌面宠物</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="pet-container">
    <div id="pet" draggable="true"></div>
    
    <!-- 互动按钮组 -->
    <div id="interaction-buttons" class="hidden">
      <button class="circular-button interact" title="互动">
        <span class="icon">A</span>
      </button>
      <button class="circular-button daily-quote" title="每日金句">
        <span class="icon">B</span>
      </button>
    </div>
    
    <!-- 弹出消息 -->
    <div id="message-popup" class="hidden">
      <div class="message-content"></div>
      <button class="close-message">×</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
